name: Link Check

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 12 * * 1"

jobs:
  link-check:
    name: Link check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress "**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
